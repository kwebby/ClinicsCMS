# Author: ramanpal singh | URL: https://kwebby.com
ServerRoot "/usr/local/apache2"
Listen 80
Listen 443
LoadModule mpm_event_module modules/mod_mpm_event.so
LoadModule unixd_module modules/mod_unixd.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule headers_module modules/mod_headers.so
LoadModule proxy_module modules/mod_proxy.so
LoadModule proxy_http_module modules/mod_proxy_http.so
LoadModule proxy_wstunnel_module modules/mod_proxy_wstunnel.so
LoadModule ssl_module modules/mod_ssl.so
LoadModule socache_shmcb_module modules/mod_socache_shmcb.so
LoadModule rewrite_module modules/mod_rewrite.so
LoadModule reqtimeout_module modules/mod_reqtimeout.so
User daemon
Group daemon
ServerName ${CLINIC_DOMAIN}
ServerTokens Prod
ServerSignature Off
TraceEnable Off
ErrorLog /proc/self/fd/2
LogFormat "%h %t %m %>s %D" minimal
CustomLog /proc/self/fd/1 minimal
Timeout 70
RequestReadTimeout header=10-30,MinRate=500 body=20,MinRate=500
LimitRequestBody 27262976
SSLSessionCache shmcb:/tmp/ssl_scache(512000)
<VirtualHost *:80>
  ServerName ${CLINIC_DOMAIN}
  RewriteEngine On
  RewriteCond expr "req('Host') != '${CLINIC_DOMAIN}' && req('Host') != '${CLINIC_DOMAIN}:443' && req('Host') != '${CLINIC_DOMAIN}:80'"
  RewriteRule ^ - [F,L]
  RewriteRule ^ https://${CLINIC_DOMAIN}%{REQUEST_URI} [R=308,L,NE]
</VirtualHost>
<VirtualHost *:443>
  ServerName ${CLINIC_DOMAIN}
  SSLEngine On
  SSLCertificateFile /etc/clinic/tls/fullchain.pem
  SSLCertificateKeyFile /etc/clinic/tls/privkey.pem
  SSLProtocol -all +TLSv1.2 +TLSv1.3
  Header always set Strict-Transport-Security "max-age=31536000"
  Header always set X-Content-Type-Options "nosniff"
  Header always set X-Frame-Options "DENY"
  Header always set Referrer-Policy "strict-origin-when-cross-origin"
  RewriteEngine On
  RewriteCond expr "req('Host') != '${CLINIC_DOMAIN}' && req('Host') != '${CLINIC_DOMAIN}:443' && req('Host') != '${CLINIC_DOMAIN}:80'"
  RewriteRule ^ - [F,L]
  ProxyRequests Off
  ProxyPreserveHost On
  RequestHeader unset X-Forwarded-For early
  RequestHeader unset X-Forwarded-Host early
  RequestHeader set X-Forwarded-Proto "https"
  ProxyPass /socket.io/ http://api:4000/socket.io/ upgrade=websocket timeout=90
  ProxyPassReverse /socket.io/ http://api:4000/socket.io/
  ProxyPass /api/ http://api:4000/api/ timeout=70
  ProxyPassReverse /api/ http://api:4000/api/
  <Location /api/>
    Header always set Cache-Control "private, no-store"
  </Location>
  ProxyPass / http://web:3000/
  ProxyPassReverse / http://web:3000/
</VirtualHost>
